<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이아깽 후원기록 · 로그인</title><style>body{font:15px system-ui;background:#f5f6fb;color:#27324a;display:grid;place-items:center;min-height:95vh;margin:0}main{background:white;padding:40px;border:1px solid #e3e5ef;border-radius:18px;width:min(340px,78vw)}small{color:#8982c3;letter-spacing:2px}h1{font-size:24px}p{color:#8791a3;line-height:1.8;font-size:12px}input,button{box-sizing:border-box;width:100%;padding:13px;border:1px solid #d9ddeb;border-radius:8px;font:inherit}button{margin-top:12px;background:#6860d7;color:#fff;cursor:pointer}a{color:#8580bd;font-size:12px}#error{color:#bd5555}</style><main><small>STARWAVE SOLO</small><h1>이아깽 후원기록</h1><p>기록실은 비밀번호로 보호되어 있습니다.<br>스폰일지 관리자 비밀번호를 입력해 주세요.</p><form><input type="password" name="password" aria-label="비밀번호" placeholder="비밀번호" autocomplete="current-password" required><button>기록실 열기</button></form><p id="error" role="alert"></p><a href="/">← 기존 사이트로 돌아가기</a></main><script>document.querySelector('form').onsubmit=async e=>{e.preventDefault();const button=e.target.querySelector('button');button.disabled=true;try{const r=await fetch('/solo/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:e.target.password.value})});const p=await r.json();if(!r.ok)throw Error(p.error);location.reload();}catch(e){document.getElementById('error').textContent=e.message;}finally{button.disabled=false;}};</script></html>
