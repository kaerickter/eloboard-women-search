      <span class="site-user"><strong>이아킴</strong><em>관리자</em></span>
    </nav>

    <main class="cctv-shell">
      <header class="cctv-hero">
        <div>
          <h1>cctv</h1>
          <p>티어표 데이터를 기준으로 6티어, 5티어, 8티어, JSA, 케이대처럼 그룹별 방송을 한 화면에서 봅니다.</p>
        </div>
        <div class="cctv-actions">
          <button id="randomBtn" class="primary" type="button">아무나 방송보기</button>
          <button id="retryBtn" type="button">작은 화면 복구</button>
          <button id="refreshBtn" type="button">LIVE 새로고침</button>
          <button id="stopBtn" type="button">전체 정지</button>
        </div>
      </header>

      <section class="cctv-panel cctv-filter-panel">
        <div id="filterbar" class="cctv-filters" aria-label="cctv 필터"></div>
      </section>

      <div class="cctv-layout">
        <div>
          <section class="cctv-panel cctv-main">
            <div class="cctv-head"><b id="mainTitle">MAIN - 선택 없음</b><span id="mainStatus" class="cctv-status">대기</span></div>
            <div class="cctv-player"><video id="mainVideo" controls autoplay playsinline></video></div>
            <div id="mainMeta" class="cctv-meta">방송 중인 작은 화면을 클릭하거나 아무나 방송보기를 누르면 최고화질로 연결됩니다.</div>
          </section>
          <div id="log" class="cctv-panel cctv-log"></div>
        </div>
        <aside id="grid" class="cctv-grid" aria-label="작은 방송 화면"></aside>
      </div>
    </main>

    <script src="./cctv.js?v=20260808-cctv"></script>
  </body>
