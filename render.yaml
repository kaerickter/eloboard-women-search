services:
  - type: web
    name: elo-kitten
    runtime: node
    plan: free
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm install && ((python -m pip install --user -U yt-dlp && python -m yt_dlp --version) || (python3 -m pip install --user -U yt-dlp && python3 -m yt_dlp --version))
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: TIER_ADMIN_PASSWORD
        sync: false
      - key: SPAWN_DIARY_ADMIN_PASSWORD
        sync: false
      - key: TIER_ADMIN_REQUIRE_DATABASE
        value: "true"
