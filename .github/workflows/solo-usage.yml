name: Donation archive usage notice
on:
  schedule:
    - cron: '25 0,6,12,18 * * *'
  workflow_dispatch:
permissions:
  issues: write
concurrency:
  group: solo-usage-notice
  cancel-in-progress: false
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Notify repository owner when usage needs attention
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node <<'NODE'
          (async()=>{
            const r=await fetch('https://elo-kitten.onrender.com/solo/usage-notice',{signal:AbortSignal.timeout(90000)});
            if(!r.ok)throw Error('Usage monitor unavailable');const state=await r.json();
            if(state.level==='unknown')throw Error('Usage API requires attention; check the private archive dashboard');
            if(!['warning','danger'].includes(state.level))return;
            const repo=process.env.GITHUB_REPOSITORY,headers={authorization:'Bearer '+process.env.GH_TOKEN,accept:'application/vnd.github+json','content-type':'application/json'};
            const title='[후원기록] '+(state.level==='danger'?'무료 한도 임박 · 수집 정지':'무료 사용량 주의')+' · '+state.month;
            const existing=await(await fetch('https://api.github.com/repos/'+repo+'/issues?state=all&per_page=100',{headers})).json();
            if(!Array.isArray(existing))throw Error('Could not inspect previous notices');if(existing.some(i=>i.title===title))return;
            const response=await fetch('https://api.github.com/repos/'+repo+'/issues',{method:'POST',headers,body:JSON.stringify({title,assignees:[repo.split('/')[0]],body:'무료 사용량 또는 월말 예상치를 확인해 주세요. 자세한 수치는 비밀번호로 보호된 [후원기록실](https://elo-kitten.onrender.com/solo/)에서 확인할 수 있습니다. 이 알림에는 비공개 사용량·후원자 기록을 포함하지 않습니다. 알림 이메일 수신 여부는 GitHub 알림 설정에 따릅니다.'})});
            if(!response.ok)throw Error('Could not create usage notice');console.log('Usage notice created');
          })().catch(e=>{console.error(e.message);process.exitCode=1;});
          NODE
